name: Daily Live Trading

on:
  schedule:
    # Esegue il workflow da lunedì a venerdì alle 19:45 UTC (21:45 italiane / 15:45 di New York)
    # Questo lascia 15 minuti di margine prima della chiusura di Wall Street (16:00 NY time)
    - cron: '45 19 * * 1-5'
  workflow_dispatch: # Permette l'avvio manuale da GitHub

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 1. Scarica i dati e aggiorna il database SQLite
      - name: Run Data Ingestion
        run: python run_ingestion.py --sp500 -y 1

      # 2. Esegue le previsioni ed effettua gli ordini reali/paper
      - name: Execute Live Trading
        env:
          # Passa le chiavi Alpaca e Telegram come segreti di GitHub per sicurezza
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_V6 }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_V6 }}
          ALPACA_PAPER: true
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # run: python live_predict_trade.py -m nn_v6 --pool_size 100
        run: python live_predict_trade.py -m nn_v6 --pool_size 100 --execute
